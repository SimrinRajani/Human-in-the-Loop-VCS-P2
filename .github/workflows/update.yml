name: Refresh the guide

# Every morning: fetch the newest posts from each source, save them, and redeploy the site.
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 7:17 a.m. New York (6:17 in winter)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: ai-x-product-design

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-x-product-design/package-lock.json

      - run: npm ci

      - name: Fetch the newest posts
        run: npm run fetch

      - name: Save the updated feed
        run: |
          if git diff --quiet -- site/data/feed.json; then
            echo "No new posts today."
          else
            git config user.name  "guide-bot"
            git config user.email "guide-bot@users.noreply.github.com"
            git add site/data/feed.json
            git commit -m "Refresh feed $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ai-x-product-design/site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
